# Fork-only CI.
#
# Upstream's test.yml is unusable here: nearly every job runs on
# `namespace-profile-ghostty-*` (Namespace.so custom runners that only exist
# in the ghostty-org org), so on this fork those jobs queue forever. Upstream
# workflows are disabled via repo settings on this fork; this workflow is the
# replacement, running on free GitHub-hosted `ubuntu-latest` runners.
#
# Trigger design (see comment below on `pull_request`) means this fires
# automatically for:
#   - pushes to this fork's `main`
#   - PRs whose base branch is `main` (e.g. the first PR in a stack)
# For stacked PRs whose base is another feature branch (not `main`), GitHub
# can only run workflows that are reachable from the base or head ref of the
# PR. Since this file intentionally does NOT exist on feature branches (they
# must stay upstream-mergeable), such PRs get no automatic run. Trigger one
# manually with:
#   gh workflow run fork-ci.yml --repo arturhoo/ghostty --ref <feature-branch>
# which runs this workflow definition (from main) against that branch's code.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

name: Fork CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get required Zig version
        id: zig
        run: |
          echo "version=$(sed -n -E 's/^\s*\.?minimum_zig_version\s*=\s*"([^"]+)".*/\1/p' build.zig.zon)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.zig.outputs.version }}

      # Subset of src/build/docker/debian/Dockerfile's apt packages: the GTK
      # ones are omitted because we build with -Dapp-runtime=none (and
      # libgtk4-layer-shell-dev is not packaged for ubuntu-latest anyway).
      # libonig-dev matters: the build fails without it.
      - name: Install system dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq -y --no-install-recommends install \
            build-essential \
            libbz2-dev \
            libonig-dev \
            libxml2-utils \
            pandoc \
            tmux

      - name: zig fmt
        run: zig fmt --check .

      - name: zig build test
        run: zig build test -Dapp-runtime=none --summary all

      # `zig build test` does NOT compile the embedded apprt: the test
      # step builds an exe, and src/apprt.zig only selects `embedded`
      # for a lib artifact. Building the lib does, so this catches
      # errors in src/apprt/embedded.zig that the test step cannot see.
      # It found one the first time it was run.
      - name: zig build (lib, compiles the embedded apprt)
        run: zig build -Dapp-runtime=none --summary all

      # Spawns a real tmux server and drives control mode against it.
      # Skipped by `zig build test` (they need tmux and they wait on
      # another process), so they only run here. This step is a superset
      # of `zig build test`: same binary, plus the gated tests.
      #
      # This workflow lives only on `main` but runs against feature
      # branches, and most of them predate the build step, so its absence
      # has to be a skip rather than a failure. Drop the guard once the
      # step is on `main`.
      - name: zig build test-tmux-live
        run: |
          if ! zig build -h 2>&1 | grep -q 'test-tmux-live'; then
            echo "no test-tmux-live step on this branch, skipping"
            exit 0
          fi
          tmux -V
          zig build test-tmux-live -Dapp-runtime=none --summary all

  # The same live tests, against the oldest tmux we claim to work with.
  #
  # Two behaviours in the viewer exist only for old servers, so the
  # runner's own tmux can never reach them: window sizing falls back to
  # `resize-window` below 3.4, where per-window `refresh-client -C` does
  # not exist, and `pause-after` is not sent below 3.2 at all. A version
  # gate is a branch the newer tmux never takes, which is the definition
  # of untested.
  #
  # 3.2a because that is what Ubuntu 22.04 LTS ships, which is what the
  # sizing fallback was written for, and because it is exactly the floor
  # the pause-after gate names -- so that gate is checked on its own
  # boundary rather than well inside it.
  #
  # Its own job rather than another step in `test`: that job already
  # spends around 27 of its 30 minutes, and a second live run plus a
  # tmux build does not fit. This way the two run side by side and
  # neither can push the other over.
  test-tmux-32:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get required Zig version
        id: zig
        run: |
          echo "version=$(sed -n -E 's/^\s*\.?minimum_zig_version\s*=\s*"([^"]+)".*/\1/p' build.zig.zon)" >> "$GITHUB_OUTPUT"

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.zig.outputs.version }}

      # As the `test` job, plus what building tmux needs.
      - name: Install system dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq -y --no-install-recommends install \
            bison \
            build-essential \
            libbz2-dev \
            libevent-dev \
            libncurses-dev \
            libonig-dev \
            libxml2-utils \
            pandoc

      # Built from source: every distro the runner can reach has moved
      # past 3.2a. About a minute.
      - name: Build tmux 3.2a
        run: |
          curl -fsSL -o /tmp/tmux.tar.gz \
            https://github.com/tmux/tmux/releases/download/3.2a/tmux-3.2a.tar.gz
          tar -xzf /tmp/tmux.tar.gz -C /tmp
          cd /tmp/tmux-3.2a
          ./configure --prefix="$HOME/tmux32" >/dev/null
          make -j"$(nproc)" >/dev/null
          make install >/dev/null

      # Skipped rather than failed on branches that predate the build
      # step, same as the `test` job. Drop the guard once it is on main.
      - name: zig build test-tmux-live (tmux 3.2a)
        run: |
          if ! zig build -h 2>&1 | grep -q 'test-tmux-live'; then
            echo "no test-tmux-live step on this branch, skipping"
            exit 0
          fi

          export PATH="$HOME/tmux32/bin:$PATH"
          tmux -V | grep -q '3.2a' || { echo "wrong tmux: $(tmux -V)"; exit 1; }
          zig build test-tmux-live -Dapp-runtime=none --summary all
